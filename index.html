<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>给你的一封信</title>
  <style>
    :root{
      --bg1:#17161d;
      --bg2:#0d0d12;
      --shadow: 0 18px 70px rgba(0,0,0,.45);
      --ease: cubic-bezier(.2,.8,.2,1);
      --paperFadeDur: 3000ms;

      --envW: min(86vw, 360px);
      --openDur: 3000ms;      /* 信封切换+纸淡入时长 */
      --stampTop: 40%;
      --stampSize: 100%;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; }
    body{
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(1200px 800px at 50% 10%, var(--bg1), var(--bg2));
      overflow:hidden;
      color:#fff;
    }

    #cover{
      position:fixed; inset:0;
      display:grid; place-items:center;
      padding: env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
    }

    .hint{
      position: fixed;
      left:0; right:0;
      bottom: calc(env(safe-area-inset-bottom) + 16px);
      text-align:center;
      color: rgba(255,255,255,.65);
      font-size: 14px;
      user-select:none;
      pointer-events:none;
    }

    .float{
      animation: float 3.6s ease-in-out infinite;
      transform-style: preserve-3d;
    }
    @keyframes float{
      0%,100%{ transform: translateY(0); }
      50%{ transform: translateY(-10px); }
    }

    .envelope{
      width: var(--envW);
      aspect-ratio: 3 / 2;
      position: relative;
      filter: drop-shadow(var(--shadow));
    }

    /* 两张信封图叠加：闭合/打开 */
    .envState{
      position:absolute; inset:0;
      width:100%; height:100%;
      pointer-events:none;
      transition: opacity var(--openDur) var(--ease);
    }
    .envState img{
      width:100%; height:100%;
      object-fit: contain;
      display:block;
      user-select:none;
      -webkit-user-drag:none;
    }
    .envClosed{ opacity: 1; }
    .envOpen{ opacity: 0; }

    /* 信纸预览：直接淡入（你想要的 0→100） */
    .paperPreview{
      position:absolute;
      left: 7%;
      width: 86%;
      height: 120%;
      top: 22%;
      border-radius: 10px;
      overflow:hidden;
      opacity: 0;
      transition: opacity var(--openDur) var(--ease);
      background: rgba(255,255,255,.12);
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
      pointer-events:none;
    }
    .paperPreview img{
      width:100%;
      height:100%;
      object-fit: cover;
      object-position: top center;
      display:block;
      user-select:none;
      -webkit-user-drag:none;
    }

    /* 邮戳：点它开信 */
    .stamp{
      position:absolute;
      left:50%;
      top: var(--stampTop);
      width: var(--stampSize);
      height: var(--stampSize);
      transform: translate(-50%,-50%);
      border:0;
      background: transparent;
      padding:0;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 240ms ease, transform 260ms ease;
      z-index: 5;
    }
    .stamp img{
      width:100%;
      height:100%;
      object-fit: contain;
      display:block;
      user-select:none;
      -webkit-user-drag:none;
      pointer-events:none;
    }
    .stamp.gone{
      opacity:0;
      transform: translate(-50%,-50%) scale(0.9);
      pointer-events:none;
    }

    /* 打开态：闭合图淡出、打开图淡入、纸淡入 */
    .opened .envClosed{ opacity: 0; }
    .opened .envOpen{ opacity: 1; }
    .opened .paperPreview{ opacity: 1; }

    /* 阅读页 */
    #reader{
      position: fixed; inset:0;
      display:none;
      overflow:hidden;
      background: rgba(10,10,14,.92);
    }
    #reader.show{ display:block; }

    .topbar{
      position: sticky;
      top: 0;
      z-index: 10;
      padding: calc(env(safe-area-inset-top) + 10px) 12px 10px;
      display:flex;
      justify-content: space-between;
      align-items:center;
      backdrop-filter: blur(10px);
      background: linear-gradient(to bottom, rgba(10,10,14,.72), rgba(10,10,14,0));
    }
    .btn{
      border:0;
      border-radius: 999px;
      padding: 10px 12px;
      background: rgba(255,255,255,.14);
      color: rgba(255,255,255,.92);
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .scrollArea{
      position:absolute;
      inset: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: calc(env(safe-area-inset-top) + 58px) 14px calc(env(safe-area-inset-bottom) + 40px);
    }

    .paperWrap{ max-width: 720px; margin: 0 auto; }
    .paperCard{
      border-radius: 18px;
      overflow:hidden;
      box-shadow: var(--shadow);
      background: #fff7ef;
    }
    .paperCard img{
      width:100%;
      height:auto;
      display:block;
    }

    @media (prefers-reduced-motion: reduce){
      .float{ animation:none; }
      .envState, .paperPreview, .stamp{ transition:none; }
    }
  </style>
</head>

<body>

  <section id="cover" aria-label="信封封面">
    <div class="float">
      <div class="envelope" id="envelope">

        <div class="paperPreview" aria-hidden="true">
          <img id="paperPreviewImg" alt="" />
        </div>

        <div class="envState envClosed">
          <img id="envClosedImg" alt="信封" />
        </div>

        <div class="envState envOpen">
          <img id="envOpenImg" alt="打开的信封" />
        </div>

        <button class="stamp" id="stampBtn" aria-label="撕开邮戳开启信封">
          <img id="stampImg" alt="邮戳" />
        </button>

      </div>
    </div>

    <div class="hint">点一下邮戳</div>
  </section>

  <section id="reader" aria-label="信纸阅读">
    <div class="topbar">
      <button class="btn" id="backBtn">返回</button>
      <button class="btn" id="toTopBtn">回到顶部</button>
    </div>

    <div class="scrollArea" id="scrollArea">
      <div class="paperWrap">
        <div class="paperCard">
          <img id="paperImg" alt="信纸内容" />
        </div>
      </div>
    </div>
  </section>

  <script>
    const ASSETS = {
      closed: "./assets/feng.png",
      open: "./assets/feng_open.png",     // ← 你新增的打开信封
      stamp: "./assets/ko.png",
      paper: "./assets/生日信.png",
    };

    const cover = document.getElementById("cover");
    const reader = document.getElementById("reader");
    const envelope = document.getElementById("envelope");

    const envClosedImg = document.getElementById("envClosedImg");
    const envOpenImg = document.getElementById("envOpenImg");
    const stampImg = document.getElementById("stampImg");
    const paperPreviewImg = document.getElementById("paperPreviewImg");
    const paperImg = document.getElementById("paperImg");

    envClosedImg.src = ASSETS.closed;
    envOpenImg.src   = ASSETS.open;
    stampImg.src     = ASSETS.stamp;
    paperPreviewImg.src = ASSETS.paper;
    paperImg.src        = ASSETS.paper;

    Object.values(ASSETS).forEach(src => { const img = new Image(); img.src = src; });

    function openLetter() {
      envelope.classList.add("opened");
      const total = 3000; // 要和 --openDur 一致
      setTimeout(() => {
        cover.style.display = "none";
        reader.classList.add("show");
        document.getElementById("scrollArea").scrollTo({ top: 0, behavior: "instant" });
      }, total);
    }

    function closeLetter() {
  reader.classList.remove("show");
  cover.style.display = "grid";
  envelope.classList.remove("opened");
  const btn = document.getElementById("stampBtn");
  btn.classList.remove("gone");
  btn.disabled = false; // 可选：恢复点击
}

   document.getElementById("stampBtn").addEventListener("click", () => {
  const btn = document.getElementById("stampBtn");
  btn.classList.add("gone");        // ① 先让邮戳淡出

  btn.disabled = true;             // ② 可选：防止连点
  setTimeout(() => openLetter(), 150); // ③ 等 150ms 再开信（你可改 100~300）
});

    document.getElementById("backBtn").addEventListener("click", closeLetter);
    document.getElementById("toTopBtn").addEventListener("click", () => {
      document.getElementById("scrollArea").scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
</body>
</html>
