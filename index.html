<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>给你的一封信</title>

  <style>
    :root{
      --bg1:#17161d;
      --bg2:#0d0d12;
      --shadow: 0 18px 70px rgba(0,0,0,.45);
      --ease: cubic-bezier(.2,.8,.2,1);

      /* 封面信封大小（手机自适应） */
      --envW: min(86vw, 380px);

      /* 交叉淡入淡出时长 */
      --fadeDur: 520ms;

      /* 浮动幅度 */
      --floatPx: 10px;
    }

    *{ box-sizing:border-box; }
    html, body { height:100%; margin:0; }
    body{
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(1200px 800px at 50% 10%, var(--bg1), var(--bg2));
      color:#fff;
      overflow:hidden;
    }

    /* ========== Cover ========== */
    #cover{
      position:fixed; inset:0;
      display:grid; place-items:center;
      padding: env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
      opacity: 1;
      transition: opacity var(--fadeDur) var(--ease);
    }
    body[data-stage="2"] #cover{
      opacity:0;
      pointer-events:none;
    }

    .envelopeWrap{
      width: var(--envW);
      aspect-ratio: 3 / 2;
      position: relative;
      filter: drop-shadow(var(--shadow));
      transform-style: preserve-3d;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
    }

    /* 浮动动画（stage 0/1 才需要） */
    body[data-stage="0"] .envelopeWrap,
    body[data-stage="1"] .envelopeWrap{
      animation: float 3.6s ease-in-out infinite;
    }
    @keyframes float{
      0%,100%{ transform: translateY(0); }
      50%{ transform: translateY(calc(-1 * var(--floatPx))); }
    }

    /* 两张图叠加做交叉淡入淡出 */
    .envImg{
      position:absolute; inset:0;
      width:100%; height:100%;
      object-fit: contain;
      display:block;
      transition: opacity var(--fadeDur) var(--ease);
      pointer-events:none;
      -webkit-user-drag:none;
    }
    #imgClosed{ opacity: 1; }
    #imgOpen  { opacity: 0; }

    /* stage 1：切到打开图 */
    body[data-stage="1"] #imgClosed{ opacity: 0; }
    body[data-stage="1"] #imgOpen  { opacity: 1; }

    .hint{
      position: fixed;
      left:0; right:0;
      bottom: calc(env(safe-area-inset-bottom) + 18px);
      text-align:center;
      color: rgba(255,255,255,.75);
      font-size: 14px;
      letter-spacing: .2px;
      user-select:none;
      pointer-events:none;
      transition: opacity 240ms ease;
    }

    /* ========== Reader ========== */
    #reader{
      position: fixed; inset:0;
      display:none;
      opacity:0;
      transition: opacity var(--fadeDur) var(--ease);
      background: rgba(10,10,14,.92);
    }
    body[data-stage="2"] #reader{
      display:block;
      opacity:1;
    }

    .topbar{
      position: sticky;
      top: 0;
      z-index: 10;
      padding: calc(env(safe-area-inset-top) + 10px) 12px 10px;
      display:flex;
      justify-content: space-between;
      align-items:center;
      backdrop-filter: blur(10px);
      background: linear-gradient(to bottom, rgba(10,10,14,.72), rgba(10,10,14,0));
    }
    .btn{
      border:0;
      border-radius: 999px;
      padding: 10px 12px;
      background: rgba(255,255,255,.14);
      color: rgba(255,255,255,.92);
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .scrollArea{
      position:absolute;
      inset: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: calc(env(safe-area-inset-top) + 58px) 14px calc(env(safe-area-inset-bottom) + 40px);
    }
    .paperWrap{ max-width: 720px; margin: 0 auto; }
    .paperCard{
      border-radius: 18px;
      overflow:hidden;
      box-shadow: var(--shadow);
      background: #fff7ef;
    }
    .paperCard img{
      width:100%;
      height:auto;
      display:block;
      -webkit-user-drag:none;
      user-select:none;
    }

    @media (prefers-reduced-motion: reduce){
      .envelopeWrap{ animation:none !important; }
      #cover, .envImg, #reader{ transition:none; }
    }
  </style>
</head>

<body data-stage="0">
  <!-- 封面 -->
  <section id="cover" aria-label="封面信封">
    <div class="envelopeWrap" id="envelopeBtn" aria-label="点击">
      <img id="imgClosed" class="envImg" alt="信封" />
      <img id="imgOpen" class="envImg" alt="打开的信封" />
    </div>
    <div class="hint" id="hintText">点击邮戳</div>
  </section>

  <!-- 阅读页 -->
  <section id="reader" aria-label="信纸阅读">
    <div class="topbar">
      <button class="btn" id="backBtn">返回</button>
      <button class="btn" id="toTopBtn">回到顶部</button>
    </div>

    <div class="scrollArea" id="scrollArea">
      <div class="paperWrap">
        <div class="paperCard">
          <img id="paperImg" alt="信纸内容" />
        </div>
      </div>
    </div>
  </section>

  <script>
    // ====== 改这里：你的素材路径 ======
    const ASSETS = {
      fengko:   "./assets/fengko.png",
      fengopen: "./assets/fengopen.png",
      xinzhi:   "./assets/xinzhi.png",
    };

    const body = document.body;
    const envelopeBtn = document.getElementById("envelopeBtn");
    const hintText = document.getElementById("hintText");

    const imgClosed = document.getElementById("imgClosed");
    const imgOpen = document.getElementById("imgOpen");
    const paperImg = document.getElementById("paperImg");

    // 绑定图片
    imgClosed.src = ASSETS.fengko;
    imgOpen.src = ASSETS.fengopen;
    paperImg.src = ASSETS.xinzhi;

    // 预加载
    Object.values(ASSETS).forEach(src => { const im = new Image(); im.src = src; });

    // stage 0: 显示 fengko + “点击邮戳”
    // stage 1: 交叉淡入切到 fengopen + “点击阅读”
    // stage 2: 交叉淡出 cover -> 显示 reader（xinzhi 可滚动）

    function setStage(n){
      body.setAttribute("data-stage", String(n));
      if (n === 0) hintText.textContent = "点击邮戳";
      if (n === 1) hintText.textContent = "点击阅读";
      if (n === 2) hintText.textContent = ""; // 进入阅读页后可不显示
    }

    envelopeBtn.addEventListener("click", () => {
      const stage = body.getAttribute("data-stage");

      if (stage === "0") {
        // 0 -> 1：fengko 淡出，fengopen 淡入
        setStage(1);
        return;
      }

      if (stage === "1") {
        // 1 -> 2：封面淡出 -> 进入阅读页
        setStage(2);
        // 确保从顶部开始阅读
        document.getElementById("scrollArea").scrollTo({ top: 0, behavior: "instant" });
        return;
      }
    });

    // 返回封面（回到 stage 1：打开信封态）
    document.getElementById("backBtn").addEventListener("click", () => {
      setStage(1);
    });

    document.getElementById("toTopBtn").addEventListener("click", () => {
      document.getElementById("scrollArea").scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
</body>
</html>
